<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft 资源下载站</title>
  <style>
    :root {
      --primary: #2e7d32;
      --primary-hover: #1b5e20;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-sub: #7f8c8d;
      --border-color: #e0e0e0;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
    }

    /* 顶部导航 */
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0.8rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--primary);
      text-decoration: none;
    }

    /* [图片占位] Logo 图片尺寸标准 */
    .logo img {
      height: 28px;
      width: auto;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .nav-links a {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    /* 汉堡菜单开关 (仅移动端) */
    .menu-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-main);
    }

    /* 主内容区 */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* 头部 Banner 区 */
    .hero {
      text-align: center;
      padding: 2.5rem 1rem;
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      margin-bottom: 2rem;
    }

    .hero h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .quick-links {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 1.2rem 0;
      flex-wrap: wrap;
    }

    /* 扁平化按钮样式 */
    .btn {
      display: inline-block;
      padding: 0.5rem 1.2rem;
      background-color: var(--primary);
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn-outline {
      background-color: transparent;
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    .btn-outline:hover {
      background-color: var(--primary);
      color: #fff;
    }

    .hero p {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    /* [图片占位] 顶部 Banner 图片 */
    .hero-banner-img {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: var(--radius);
      margin-top: 1.5rem;
    }

    /* 卡片网格布局 */
    .section-title {
      font-size: 1.4rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    /* 扁平化展示卡片 */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s;
    }

    .card:hover {
      border-color: var(--primary);
    }

    /* [图片占位] 资源卡片封面图容器 */
    .card-img {
      width: 100%;
      height: 160px;
      background-color: #eaeff1;
      object-fit: cover;
    }

    .card-body {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 1.1rem;
      margin-bottom: 0.4rem;
    }

    .card-desc {
      color: var(--text-sub);
      font-size: 0.88rem;
      margin-bottom: 1rem;
      flex-grow: 1;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tag {
      font-size: 0.75rem;
      background-color: #e8f5e9;
      color: var(--primary);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }

    /* 响应式导航设计 (移动端) */
    @media (max-width: 768px) {
      .menu-toggle {
        display: block;
      }

      .nav-links {
        display: none; /* 默认隐藏 */
        flex-direction: column;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background-color: var(--card-bg);
        border-bottom: 1px solid var(--border-color);
        padding: 1rem 0;
        gap: 1rem;
      }

      .nav-links.active {
        display: flex; /* 点击菜单后显示 */
      }
    }
  </style>
</head>
<body>

  <!-- 头部导航栏 -->

      <button class="menu-toggle" aria-label="切换菜单" onclick="toggleMenu()">☰</button>

        <article class="card">

    </section>

  </main>

  <!-- JS: 处理移动端汉堡菜单切换 -->
  <script>
    function toggleMenu() {
      const navLinks = document.getElementById('navLinks');
      navLinks.classList.toggle('active');
    }
  </script>
</body>
</html>
