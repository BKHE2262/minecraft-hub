<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOD与光影 - Minecraft Hub</title>
  <style>
    :root {
      --primary: #2e7d32;
      --primary-hover: #1b5e20;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-sub: #7f8c8d;
      --border-color: #e0e0e0;
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); color: var(--text-main); line-height: 1.6; }
    
    header { background: var(--card-bg); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 1000; }
    .nav-container { max-width: 1100px; margin: 0 auto; padding: 0.8rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.25rem; font-weight: bold; color: var(--primary); text-decoration: none; }
    .nav-links { display: flex; gap: 1.5rem; }
    .nav-links a { color: var(--text-main); text-decoration: none; font-weight: 500; }
    .nav-links a.active { color: var(--primary); font-weight: bold; }
    
    .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
    .page-header { background: var(--card-bg); padding: 2rem; border-radius: var(--radius); border: 1px solid var(--border-color); margin-bottom: 2rem; }
    .page-header h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
    .card-img { width: 100%; height: 160px; object-fit: cover; background: #eaeff1; }
    .card-body { padding: 1.2rem; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-size: 1.1rem; margin-bottom: 0.4rem; }
    .card-desc { font-size: 0.9rem; color: var(--text-sub); margin-bottom: 1.2rem; flex-grow: 1; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; }
    
    .btn { display: inline-block; padding: 0.4rem 1rem; background: var(--primary); color: #fff; border-radius: 6px; text-decoration: none; font-size: 0.88rem; }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">🎮 Minecraft Hub</a>
      <nav class="nav-links">
        <a href="index.html">首页</a>
        <a href="packs.html">整合包</a>
        <a href="shaderpacks.html" class="active">MOD/光影</a>
        <a href="worlds.html">地图存档</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <h1>⚡ 性能优化与光影组件</h1>
      <p style="color: var(--text-sub);">极高提升游戏 FPS，支持各类光影追踪包与核心辅助 MOD。</p>
    </div>

    <div class="grid">
      <!-- 资源 1 -->
      <article class="card">
        <!-- [图片占位] 资源封面图：images/mods/sodium.jpg -->
        <img src="https://via.placeholder.com/400x200?text=Sodium+Optimization" alt="Sodium 优化" class="card-img">
        <div class="card-body">
          <h3 class="card-title">Sodium (钠) 渲染优化 MOD</h3>
          <p class="card-desc">针对现代显卡大幅重构渲染引擎，比传统 OptiFine 带来高达 2-4 倍的 FPS 提升。</p>
          <div class="card-footer">
            <span style="font-size: 0.75rem; background: #e1f5fe; color: #0288d1; padding: 0.2rem 0.5rem; border-radius: 4px;">性能增强</span>
            <a href="null.html" class="btn">下载文件</a>
          </div>
        </div>
      </article>

      <!-- 资源 2 -->
      <article class="card">
        <!-- [图片占位] 资源封面图：images/mods/shader-bsl.jpg -->
        <img src="https://via.placeholder.com/400x200?text=BSL+Shaders" alt="BSL 光影" class="card-img">
        <div class="card-body">
          <h3 class="card-title">BSL Shaders 光影包</h3>
          <p class="card-desc">画质极其优雅的高清光影，拥有出色的水面反射、体积云与日光散射效果。</p>
          <div class="card-footer">
            <span style="font-size: 0.75rem; background: #fff3e0; color: #f57c00; padding: 0.2rem 0.5rem; border-radius: 4px;">光影渲染</span>
            <a href="null.html" class="btn">下载文件</a>
          </div>
        </div>
      </article>
    </div>
  </main>
</body>
</html>
